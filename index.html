<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD Search</title>
<meta name="description" content="GD Search: a Geometry Dash themed search page powered by Bing.">

<!-- Chunky game style fonts from Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;900&display=swap" rel="stylesheet">

<style>
  /* =========================================================
     THEME TOKENS
     All the main colors live here so they are easy to change.
     ========================================================= */
  :root {
    --sky-top: #0b1240;
    --sky-mid: #1a2a8c;
    --sky-low: #2f3fd6;
    --outline: #0a0a1a;        /* thick dark outline color */
    --card: #1b1f4a;           /* rounded card background */
    --card-hi: #262b66;
    --green: #39e639;          /* GD play button green */
    --green-dark: #1e9e1e;
    --yellow: #ffd23f;         /* coin / accent yellow */
    --pink: #ff4fd8;
    --cyan: #3ff0ff;
    --orange: #ff8a1f;
    --text: #ffffff;
    --muted: #b8c0ff;
    --shadow: 0 8px 0 var(--outline);       /* heavy drop shadow */
    --shadow-sm: 0 5px 0 var(--outline);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* The animated level background (stars, ground, cube) is drawn on this canvas */
  #level {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
  }

  /* Everything you can click sits above the canvas */
  .page {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    padding-bottom: 170px;   /* leave room for the ground strip */
  }

  /* =========================================================
     TOP BAR: level progress bar + attempt counter, like in GD
     ========================================================= */
  .topbar {
    width: 100%;
    max-width: 720px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 6px;
  }

  .progress {
    flex: 1;
    height: 22px;
    background: #0d1030;
    border: 4px solid var(--outline);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--green), var(--cyan));
    transition: width 0.25s ease;
  }

  .percent {
    font-family: "Luckiest Guy", cursive;
    font-size: 1.3rem;
    min-width: 58px;
    text-align: right;
    text-shadow: 3px 3px 0 var(--outline);
  }

  /* =========================================================
     LOGO
     ========================================================= */
  .logo {
    margin-top: 9vh;
    font-family: "Luckiest Guy", cursive;
    font-size: clamp(3.2rem, 12vw, 6.5rem);
    letter-spacing: 3px;
    line-height: 1;
    text-align: center;
    /* Stacked text shadows fake a thick outline + drop shadow */
    text-shadow:
      -4px -4px 0 var(--outline), 4px -4px 0 var(--outline),
      -4px 4px 0 var(--outline), 4px 4px 0 var(--outline),
      0 10px 0 var(--outline);
    user-select: none;
  }

  .logo .gd {
    color: var(--yellow);
    display: inline-block;
    animation: bob 1.6s ease-in-out infinite;
  }

  .logo .word { color: var(--text); }

  /* Little bounce for the "GD" part of the logo */
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-8px) rotate(3deg); }
  }

  .tagline {
    margin-top: 14px;
    font-weight: 900;
    color: var(--muted);
    text-align: center;
    font-size: 1.05rem;
  }

  /* =========================================================
     SEARCH CARD
     ========================================================= */
  .search-card {
    margin-top: 28px;
    width: 100%;
    max-width: 720px;
    background: var(--card);
    border: 5px solid var(--outline);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 16px;
  }

  .search-row {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }

  .search-input {
    flex: 1;
    min-width: 0;
    font-family: "Nunito", sans-serif;
    font-weight: 900;
    font-size: 1.2rem;
    color: var(--outline);
    background: #ffffff;
    border: 4px solid var(--outline);
    border-radius: 18px;
    padding: 14px 18px;
    outline: none;
    box-shadow: inset 0 -5px 0 #d8dcff;
  }

  .search-input::placeholder { color: #8a90c0; }

  .search-input:focus {
    box-shadow: inset 0 -5px 0 #d8dcff, 0 0 0 4px var(--cyan);
  }

  /* The big green GD style "play" button */
  .go-btn {
    width: 74px;
    flex-shrink: 0;
    background: var(--green);
    border: 4px solid var(--outline);
    border-radius: 18px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .go-btn:hover { background: #55ff55; transform: translateY(-2px); }

  /* Squish down when pressed, like a real button */
  .go-btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--outline); }

  .go-btn svg { width: 34px; height: 34px; }

  /* =========================================================
     MODE BUTTONS (Web, Images, Videos, News, Maps)
     ========================================================= */
  .modes {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  .mode {
    font-family: "Luckiest Guy", cursive;
    font-size: 1rem;
    letter-spacing: 1px;
    color: var(--text);
    background: var(--card-hi);
    border: 4px solid var(--outline);
    border-radius: 14px;
    padding: 8px 14px 6px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    text-shadow: 2px 2px 0 var(--outline);
    transition: transform 0.08s ease;
  }

  .mode:hover { transform: translateY(-2px); }
  .mode:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--outline); }

  /* Each mode gets its own bright color when selected */
  .mode.active[data-mode="web"]    { background: var(--green);  }
  .mode.active[data-mode="images"] { background: var(--pink);   }
  .mode.active[data-mode="videos"] { background: var(--orange); }
  .mode.active[data-mode="news"]   { background: #3f8cff;       }
  .mode.active[data-mode="maps"]   { background: #b04fff;       }

  /* =========================================================
     OPTIONS ROW (open in new tab toggle)
     ========================================================= */
  .options {
    margin-top: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    font-weight: 900;
    color: var(--muted);
    flex-wrap: wrap;
  }

  /* Custom GD style checkbox */
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }

  .toggle input { display: none; }

  .toggle .box {
    width: 28px;
    height: 28px;
    background: #ffffff;
    border: 4px solid var(--outline);
    border-radius: 8px;
    box-shadow: 0 3px 0 var(--outline);
    display: grid;
    place-items: center;
    font-family: "Luckiest Guy", cursive;
    color: var(--green-dark);
    font-size: 1.2rem;
    line-height: 1;
  }

  .toggle input:checked + .box::after { content: "\2713"; }

  /* =========================================================
     RECENT SEARCHES
     ========================================================= */
  .recent {
    margin-top: 22px;
    width: 100%;
    max-width: 720px;
  }

  .recent-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .recent-title {
    font-family: "Luckiest Guy", cursive;
    font-size: 1.25rem;
    letter-spacing: 1px;
    color: var(--yellow);
    text-shadow: 3px 3px 0 var(--outline);
  }

  .clear-btn {
    font-family: "Nunito", sans-serif;
    font-weight: 900;
    font-size: 0.9rem;
    color: var(--text);
    background: #ff3b5c;
    border: 3px solid var(--outline);
    border-radius: 10px;
    padding: 4px 10px;
    box-shadow: 0 3px 0 var(--outline);
    cursor: pointer;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .chip {
    font-family: "Nunito", sans-serif;
    font-weight: 900;
    font-size: 0.95rem;
    color: var(--outline);
    background: var(--yellow);
    border: 3px solid var(--outline);
    border-radius: 999px;
    padding: 6px 14px;
    box-shadow: 0 4px 0 var(--outline);
    cursor: pointer;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chip:hover { background: #ffe680; }

  .empty-note {
    color: var(--muted);
    font-weight: 700;
  }

  /* =========================================================
     FOOTER HINT
     ========================================================= */
  .hint {
    margin-top: 22px;
    text-align: center;
    color: var(--muted);
    font-weight: 700;
    font-size: 0.95rem;
  }

  .hint kbd {
    font-family: "Luckiest Guy", cursive;
    background: var(--card-hi);
    border: 3px solid var(--outline);
    border-radius: 8px;
    padding: 2px 8px 0;
    color: var(--text);
  }

  /* =========================================================
     "ATTEMPT" POPUP that flashes when you search
     ========================================================= */
  .attempt-pop {
    position: fixed;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%) scale(0.6);
    font-family: "Luckiest Guy", cursive;
    font-size: clamp(2.5rem, 10vw, 5rem);
    color: var(--text);
    text-shadow:
      -4px -4px 0 var(--outline), 4px -4px 0 var(--outline),
      -4px 4px 0 var(--outline), 4px 4px 0 var(--outline),
      0 10px 0 var(--outline);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    white-space: nowrap;
  }

  .attempt-pop.show { animation: pop 0.7s ease forwards; }

  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
  }

  /* Phone sizes: shrink a few things so nothing scrolls sideways */
  @media (max-width: 520px) {
    .logo { margin-top: 5vh; }
    .search-card { padding: 12px; border-radius: 22px; }
    .search-input { font-size: 1rem; padding: 12px 14px; }
    .go-btn { width: 60px; }
    .mode { font-size: 0.9rem; padding: 7px 10px 5px; }
  }

  /* Respect people who turn off animations in their settings */
  @media (prefers-reduced-motion: reduce) {
    .logo .gd { animation: none; }
  }
</style>
</head>
<body>

  <!-- Animated Geometry Dash style level drawn behind the page -->
  <canvas id="level" aria-hidden="true"></canvas>

  <main class="page">

    <!-- Progress bar fills up as you type, like level progress in GD -->
    <div class="topbar">
      <div class="progress" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
      <div class="percent" id="percent">0%</div>
    </div>

    <h1 class="logo"><span class="gd">GD</span> <span class="word">Search</span></h1>
    <p class="tagline" id="attemptLabel">Attempt 1</p>

    <!-- The main search box. Submitting sends you to Bing. -->
    <form class="search-card" id="searchForm" autocomplete="off">
      <div class="search-row">
        <input
          class="search-input"
          id="searchInput"
          type="text"
          placeholder="Search the web..."
          aria-label="Search the web"
          maxlength="300"
          autofocus>
        <button class="go-btn" type="submit" aria-label="Search">
          <!-- Green play triangle, like the GD play button -->
          <svg viewBox="0 0 40 40">
            <polygon points="12,7 33,20 12,33" fill="#ffffff" stroke="#0a0a1a" stroke-width="4" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <!-- Pick what kind of Bing search to do -->
      <div class="modes" role="group" aria-label="Search type">
        <button type="button" class="mode active" data-mode="web">Web</button>
        <button type="button" class="mode" data-mode="images">Images</button>
        <button type="button" class="mode" data-mode="videos">Videos</button>
        <button type="button" class="mode" data-mode="news">News</button>
        <button type="button" class="mode" data-mode="maps">Maps</button>
      </div>

      <div class="options">
        <label class="toggle">
          <input type="checkbox" id="newTab">
          <span class="box"></span>
          Open results in a new tab
        </label>
      </div>
    </form>

    <!-- Recent searches are saved only in this browser -->
    <section class="recent" aria-label="Recent searches">
      <div class="recent-head">
        <h2 class="recent-title">Recent Searches</h2>
        <button class="clear-btn" id="clearBtn" type="button">Clear</button>
      </div>
      <div class="chips" id="chips"></div>
    </section>

    <p class="hint">Tip: click the level or press <kbd>Space</kbd> (outside the search box) to make the cube jump!</p>
  </main>

  <!-- Big "Attempt X" text that pops up when you search -->
  <div class="attempt-pop" id="attemptPop">Attempt 1</div>

<script>
/* ===========================================================
   GD SEARCH
   A Geometry Dash themed search page. Searches go to Bing.
   =========================================================== */

// ---------- Bing search links for each mode ----------
// Each one takes the typed words and builds a Bing address.
const BING_URLS = {
  web:    q => "https://www.bing.com/search?q=" + encodeURIComponent(q),
  images: q => "https://www.bing.com/images/search?q=" + encodeURIComponent(q),
  videos: q => "https://www.bing.com/videos/search?q=" + encodeURIComponent(q),
  news:   q => "https://www.bing.com/news/search?q=" + encodeURIComponent(q),
  maps:   q => "https://www.bing.com/maps?q=" + encodeURIComponent(q)
};

// ---------- Grab page elements ----------
const form = document.getElementById("searchForm");
const input = document.getElementById("searchInput");
const modeButtons = document.querySelectorAll(".mode");
const newTabBox = document.getElementById("newTab");
const chipsBox = document.getElementById("chips");
const clearBtn = document.getElementById("clearBtn");
const progressFill = document.getElementById("progressFill");
const percentText = document.getElementById("percent");
const attemptLabel = document.getElementById("attemptLabel");
const attemptPop = document.getElementById("attemptPop");

// ---------- Safe localStorage helpers ----------
// Some browsers block storage (private mode, etc.), so we wrap it in try/catch.
function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}

function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage off, ignore */ }
}

// ---------- Saved settings ----------
let currentMode = load("gds_mode", "web");
let recent = load("gds_recent", []);
let attempts = load("gds_attempts", 1);
newTabBox.checked = load("gds_newtab", false);

// Show the attempt number under the logo
attemptLabel.textContent = "Attempt " + attempts;

// ---------- Mode buttons ----------
function setMode(mode) {
  currentMode = BING_URLS[mode] ? mode : "web";
  modeButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.mode === currentMode));
  save("gds_mode", currentMode);
}

modeButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    setMode(btn.dataset.mode);
    input.focus();
  });
});

setMode(currentMode);

newTabBox.addEventListener("change", () => save("gds_newtab", newTabBox.checked));

// ---------- Progress bar ----------
// The bar fills as you type. 30 letters = 100%.
function updateProgress() {
  const pct = Math.min(100, Math.round((input.value.trim().length / 30) * 100));
  progressFill.style.width = pct + "%";
  percentText.textContent = pct + "%";
}

input.addEventListener("input", updateProgress);

// ---------- Recent searches ----------
function renderRecent() {
  chipsBox.innerHTML = "";

  if (recent.length === 0) {
    const note = document.createElement("p");
    note.className = "empty-note";
    note.textContent = "No searches yet. Go beat some levels!";
    chipsBox.appendChild(note);
    clearBtn.style.display = "none";
    return;
  }

  clearBtn.style.display = "";

  recent.forEach(item => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip";
    chip.textContent = item;          // textContent keeps typed text safe (no HTML)
    chip.title = "Search for " + item;
    chip.addEventListener("click", () => {
      input.value = item;
      updateProgress();
      runSearch(item);
    });
    chipsBox.appendChild(chip);
  });
}

function addRecent(q) {
  // Move the search to the front and keep only the newest 8
  recent = [q, ...recent.filter(r => r.toLowerCase() !== q.toLowerCase())].slice(0, 8);
  save("gds_recent", recent);
  renderRecent();
}

clearBtn.addEventListener("click", () => {
  recent = [];
  save("gds_recent", recent);
  renderRecent();
});

renderRecent();

// ---------- Doing the actual search ----------
function runSearch(q) {
  q = q.trim();
  if (!q) {
    // Nothing typed: make the cube jump and shake the box a little
    jump();
    input.focus();
    return;
  }

  addRecent(q);

  // Fill the bar to 100% like you finished the level
  progressFill.style.width = "100%";
  percentText.textContent = "100%";

  // Show the "Attempt X" popup, then count up for next time
  attemptPop.textContent = "Attempt " + attempts;
  attemptPop.classList.remove("show");
  void attemptPop.offsetWidth;        // restarts the CSS animation
  attemptPop.classList.add("show");
  attempts++;
  save("gds_attempts", attempts);
  attemptLabel.textContent = "Attempt " + attempts;

  jump();

  const url = BING_URLS[currentMode](q);

  // Wait a moment so you can see the popup, then go to Bing
  setTimeout(() => {
    if (newTabBox.checked) {
      window.open(url, "_blank", "noopener");
    } else {
      window.location.href = url;
    }
  }, 450);
}

form.addEventListener("submit", e => {
  e.preventDefault();
  runSearch(input.value);
});

/* ===========================================================
   ANIMATED LEVEL BACKGROUND
   Draws twinkling stars, a scrolling ground, spikes, and a
   cube that auto jumps over them (and jumps when you click).
   =========================================================== */
const canvas = document.getElementById("level");
const ctx = canvas.getContext("2d");

let W = 0, H = 0, groundY = 0;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

// Resize the canvas to fill the window sharply
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  groundY = H - 120;
  makeStars();
}

// ---------- Stars ----------
let stars = [];
function makeStars() {
  stars = [];
  const count = Math.round((W * H) / 9000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * (H - 140),
      r: Math.random() * 1.8 + 0.4,
      t: Math.random() * Math.PI * 2   // twinkle offset
    });
  }
}

// ---------- Cube player ----------
const CUBE = 40;
const cube = {
  x: 0,
  y: 0,       // height above the ground (0 = on ground)
  vy: 0,      // up/down speed
  angle: 0
};
const GRAVITY = 2600;
const JUMP_SPEED = 820;

function jump() {
  // Only jump when touching the ground
  if (cube.y <= 0.5) cube.vy = JUMP_SPEED;
}

// ---------- Spikes ----------
const SPEED = 330;        // how fast the level scrolls (pixels per second)
let spikes = [];
let spawnTimer = 1;
let scroll = 0;           // total distance scrolled (moves the ground tiles)

function spawnSpike() {
  // Sometimes spawn 2 spikes in a row for a tougher jump
  const group = Math.random() < 0.3 ? 2 : 1;
  for (let i = 0; i < group; i++) {
    spikes.push({ x: W + 40 + i * 34 });
  }
}

// ---------- Drawing helpers ----------
function drawStars(time) {
  for (const s of stars) {
    const a = 0.45 + 0.55 * Math.sin(time * 2 + s.t);
    ctx.globalAlpha = Math.max(0.15, a);
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawGround() {
  // Ground base color
  ctx.fillStyle = "#1430b8";
  ctx.fillRect(0, groundY, W, H - groundY);

  // Big square tiles that slide left, like GD ground
  const tile = 60;
  const offset = scroll % tile;
  ctx.strokeStyle = "rgba(10,10,26,0.45)";
  ctx.lineWidth = 3;
  for (let x = -offset; x < W + tile; x += tile) {
    for (let y = groundY; y < H; y += tile) {
      ctx.strokeRect(x, y, tile, tile);
    }
  }

  // Bright glowing line on top of the ground
  ctx.fillStyle = "#0a0a1a";
  ctx.fillRect(0, groundY - 2, W, 8);
  ctx.fillStyle = "#7fe8ff";
  ctx.fillRect(0, groundY - 1, W, 3);
}

function drawSpike(x) {
  const w = 34, h = 36;
  ctx.beginPath();
  ctx.moveTo(x, groundY);
  ctx.lineTo(x + w / 2, groundY - h);
  ctx.lineTo(x + w, groundY);
  ctx.closePath();
  ctx.fillStyle = "#0a0a1a";
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#ffffff";
  ctx.stroke();
}

function drawCube() {
  const cx = cube.x + CUBE / 2;
  const cy = groundY - cube.y - CUBE / 2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(cube.angle);

  // Drop shadow
  ctx.fillStyle = "rgba(10,10,26,0.6)";
  ctx.fillRect(-CUBE / 2 + 4, -CUBE / 2 + 6, CUBE, CUBE);

  // Main body (yellow) with thick outline
  ctx.fillStyle = "#ffd23f";
  ctx.fillRect(-CUBE / 2, -CUBE / 2, CUBE, CUBE);
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#0a0a1a";
  ctx.strokeRect(-CUBE / 2, -CUBE / 2, CUBE, CUBE);

  // Inner cyan square (classic GD cube look)
  ctx.fillStyle = "#3ff0ff";
  ctx.fillRect(-11, -11, 22, 22);
  ctx.strokeRect(-11, -11, 22, 22);

  // Eyes
  ctx.fillStyle = "#0a0a1a";
  ctx.fillRect(-7, -5, 4, 6);
  ctx.fillRect(3, -5, 4, 6);

  ctx.restore();
}

// ---------- Main loop ----------
let last = performance.now();

function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);  // seconds since last frame
  last = now;
  const time = now / 1000;

  cube.x = Math.min(W * 0.18, 220);
  scroll += SPEED * dt;

  // Spawn new spikes every so often
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnSpike();
    spawnTimer = 1.1 + Math.random() * 1.4;
  }

  // Move spikes left and remove ones that left the screen
  for (const s of spikes) s.x -= SPEED * dt;
  spikes = spikes.filter(s => s.x > -60);

  // Auto jump: if a spike is coming close, jump over it
  const ahead = spikes.find(s => s.x > cube.x && s.x - (cube.x + CUBE) < 70);
  if (ahead) jump();

  // Gravity and jumping physics
  cube.vy -= GRAVITY * dt;
  cube.y += cube.vy * dt;
  if (cube.y <= 0) {
    cube.y = 0;
    cube.vy = 0;
    // Snap rotation to the nearest flat side when landing
    cube.angle = Math.round(cube.angle / (Math.PI / 2)) * (Math.PI / 2);
  } else {
    cube.angle += 6.2 * dt;  // spin while in the air
  }

  // Draw everything (the CSS gradient shows through behind)
  ctx.clearRect(0, 0, W, H);
  drawStars(time);
  drawGround();
  spikes.forEach(s => drawSpike(s.x));
  drawCube();

  requestAnimationFrame(loop);
}

// ---------- Jump controls ----------
// Click the background to jump
canvas.addEventListener("pointerdown", jump);
document.querySelector(".page").addEventListener("pointerdown", e => {
  // Only jump if you clicked empty space, not a button or the box
  if (e.target.closest("form, button, .recent")) return;
  jump();
});

// Space bar jumps, but not while typing in the search box
window.addEventListener("keydown", e => {
  if (e.code === "Space" && document.activeElement !== input) {
    e.preventDefault();
    jump();
  }
  // Press "/" to jump straight into the search box
  if (e.key === "/" && document.activeElement !== input) {
    e.preventDefault();
    input.focus();
  }
});

window.addEventListener("resize", resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
